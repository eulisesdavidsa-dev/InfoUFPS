# Servidor
quarkus.http.port=8080

# Base de datos PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:infoufps}
quarkus.datasource.password=${DB_PASSWORD:info_ufps_bd}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/info_ufps_bd}

# Hibernate: crea/actualiza tablas solo en desarrollo
%dev.quarkus.hibernate-orm.database.generation=update
%prod.quarkus.hibernate-orm.database.generation=validate

# CORS para el frontend en Vite
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:5173