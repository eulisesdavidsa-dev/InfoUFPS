# Servidor
quarkus.http.port=8080

# Base de datos PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require}

# Hibernate: crea/actualiza tablas solo en desarrollo
%dev.quarkus.hibernate-orm.database.generation=update
%prod.quarkus.hibernate-orm.database.generation=validate

# CORS para el frontend en Vite
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:5173

# Pruebas: base H2 en memoria (no usa PostgreSQL ni variables de entorno)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create