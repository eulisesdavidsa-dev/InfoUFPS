# Servidor
quarkus.http.port=8080

# Base de datos Supabase
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/infoufps}

# Hibernate: el esquema lo gestiona Flyway; no se genera automáticamente
%dev.quarkus.hibernate-orm.database.generation=none
%prod.quarkus.hibernate-orm.database.generation=validate

# Migraciones Flyway (tablas del módulo Calendario)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
# La base existente ya tiene tablas de otros módulos: se crea la línea base en 0
# para que la migración V1 se ejecute igualmente.
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# Módulo Calendario
calendar.daily-proposal-limit=5
calendar.frontend.base-url=http://localhost:5173
calendar.frontend.event-path=/eventos/{id}
calendar.api.base-url=http://localhost:8080
calendar.share.logo-url=http://localhost:5173/logo.png

# Módulo Calendario en producción: sin valores locales, todo por variables de entorno
%prod.calendar.daily-proposal-limit=${CALENDAR_DAILY_PROPOSAL_LIMIT:5}
%prod.calendar.frontend.base-url=${CALENDAR_FRONTEND_BASE_URL}
%prod.calendar.frontend.event-path=${CALENDAR_FRONTEND_EVENT_PATH:/eventos/{id}}
%prod.calendar.api.base-url=${CALENDAR_API_BASE_URL}
%prod.calendar.share.logo-url=${CALENDAR_SHARE_LOGO_URL}

# CORS para el frontend en Vite (desarrollo)
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:5173

# CORS en producción: orígenes permitidos separados por comas
%prod.quarkus.http.cors=true
%prod.quarkus.http.cors.origins=${CORS_ORIGINS}

# Pruebas de integración con base de datos en memoria
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:infoufps-test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.migrate-at-start=false

